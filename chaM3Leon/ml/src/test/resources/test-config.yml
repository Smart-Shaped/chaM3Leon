ml:
  hdfs:
    readers:
      default: ""
      reader1:
        class: "com.smartshaped.chameleon.ml.CustomReader"
        path: "/tif"
  cassandra:
    model:
      class: "com.smartshaped.chameleon.ml.utils.TableModelExample"
    node: "127.0.0.1"
    port: "9042"
    datacenter: "datacenter1"
    keyspace:
      name: "test"
      replication_factor: 1
  blackbox:
    class: "com.smartshaped.chameleon.ml.blackbox.PythonBlackboxExample"
    inputs: "input"
    output: "output"
    modelPath: "model_path"
    folder: "/user/spark/blackbox"
    python:
      scriptPath: "script.py"
      extraScripts: "extra_script.py"
      libraries: "library1,library2"
      requirementsPath: "requirements.txt"
      extraArguments:
        key1: "value1"
        key2: "value2"
        key3: "value3"
  pipeline:
    class: "com.smartshaped.chameleon.ml.PipelineExample"
  modelSaver:
    class: "com.smartshaped.chameleon.ml.ModelSaverExample"
