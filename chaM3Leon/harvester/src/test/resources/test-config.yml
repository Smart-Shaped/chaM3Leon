    HarvesterExample:
      params:
        splittingFactorX: "64"
        splittingFactorY: "64"
        rescalingFactorX: "0.01"
        rescalingFactorY: "0.01"
  harvesters:
    harvester1:
      inputPath: ""
      class: "com.smartshaped.chameleon.harvester.HarvesterExample"
      downloader:
        class: "com.smartshaped.chameleon.harvester.DownloaderExample"
      transformer: "com.smartshaped.chameleon.harvester.TransformerExample"
      preprocessor: "com.smartshaped.chameleon.harvester.PreprocessorExample"
      saver:
        class: "HarvesterSaver"
        path: "/some/path"
        checkpoint: ""
